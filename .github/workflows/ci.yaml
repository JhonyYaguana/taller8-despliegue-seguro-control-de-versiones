name: CI - Huellitas Adopción Mascotas

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar calidad de código con ESLint
        run: npm run lint

      - name: Compilar aplicación React
        run: npm run build

      - name: Almacenar carpeta dist como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: huellitas-dist
          path: dist/
      
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Verificar identidad AWS
        run: aws sts get-caller-identity
      
      - name: Desplegar en Amazon S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }}
